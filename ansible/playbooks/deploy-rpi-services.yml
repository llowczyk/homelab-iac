---
- name: Deploy Pi services (adguard, homer, wikijs, zabbix-agent) and backups
  hosts: rpi
  become: true

  tasks:
    # --- NAS mount ---
    - name: Install NFS client
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true

    - name: Create NAS mount point
      ansible.builtin.file:
        path: /mnt/nas
        state: directory
        mode: "0755"

    - name: Persist NAS share in fstab
      ansible.posix.mount:
        path: /mnt/nas
        src: "192.168.20.102:/mnt/nas"
        fstype: nfs
        opts: defaults,_netdev,nofail,x-systemd.automount
        state: present
      notify: Reload nas automount

    # --- infra network ---
    - name: Ensure infra Docker network exists
      community.docker.docker_network:
        name: infra
        state: present

    # --- adguard ---
    - name: Create adguard directory
      ansible.builtin.file: { path: /home/pi/docker-files/adguard, state: directory, mode: "0755" }
    - name: Deploy adguard compose file
      ansible.builtin.template: { src: templates/rpi-adguard-compose.yml.j2, dest: /home/pi/docker-files/adguard/adguard-compose.yaml, mode: "0644" }
    - name: Start adguard
      community.docker.docker_compose_v2: { project_src: /home/pi/docker-files/adguard, files: [adguard-compose.yaml], state: present }

    # --- homer ---
    - name: Create homer directory
      ansible.builtin.file: { path: /home/pi/docker-files/homer, state: directory, mode: "0755" }
    - name: Deploy homer compose file
      ansible.builtin.template: { src: templates/rpi-homer-compose.yml.j2, dest: /home/pi/docker-files/homer/homer-compose.yaml, mode: "0644" }
    - name: Deploy homer config
      ansible.builtin.template: { src: templates/rpi-homer-config.yml.j2, dest: /home/pi/docker-files/homer/config/config.yml, mode: "0644" }
    - name: Start homer
      community.docker.docker_compose_v2: { project_src: /home/pi/docker-files/homer, files: [homer-compose.yaml], state: present }

    # --- zabbix-agent ---
    - name: Create zabbix-agent directory
      ansible.builtin.file: { path: /home/pi/docker-files/zabbix-agent, state: directory, mode: "0755" }
    - name: Deploy zabbix-agent compose file
      ansible.builtin.template:
        src: templates/rpi-zabbix-agent-compose.yml.j2
        dest: /home/pi/docker-files/zabbix-agent/zabbix-agent-compose.yaml
        mode: "0644"
    - name: Start zabbix-agent
      community.docker.docker_compose_v2: { project_src: /home/pi/docker-files/zabbix-agent, files: [zabbix-agent-compose.yaml], state: present }

    # --- promtail ---
    - name: Create promtail directory
      ansible.builtin.file: { path: /home/pi/docker-files/promtail, state: directory, mode: "0755" }
    - name: Deploy promtail compose file
      ansible.builtin.template:
        src: templates/rpi-promtail-compose.yml.j2
        dest: /home/pi/docker-files/promtail/promtail-compose.yaml
        mode: "0644"
    - name: Deploy promtail config
      ansible.builtin.template: { src: templates/promtail-config.yml.j2, dest: /home/pi/docker-files/promtail/promtail-config.yml, mode: "0644" }
    - name: Start promtail
      community.docker.docker_compose_v2: { project_src: /home/pi/docker-files/promtail, files: [promtail-compose.yaml], state: present }

    # --- portainer agent ---
    - name: Create portainer-agent directory
      ansible.builtin.file: { path: /home/pi/docker-files/portainer-agent, state: directory, mode: "0755" }
    - name: Deploy portainer-agent compose file
      ansible.builtin.template:
        src: templates/rpi-portainer-agent-compose.yml.j2
        dest: /home/pi/docker-files/portainer-agent/portainer-agent-compose.yaml
        mode: "0644"
    - name: Start portainer-agent
      community.docker.docker_compose_v2:
        project_src: /home/pi/docker-files/portainer-agent
        files: [portainer-agent-compose.yaml]
        state: present

    # --- diun ---
    - name: Create diun directory
      ansible.builtin.file:
        path: /home/pi/docker-files/diun
        state: directory
        mode: "0755"

    - name: Deploy diun compose file
      ansible.builtin.template:
        src: templates/diun-compose.yml.j2
        dest: /home/pi/docker-files/diun/docker-compose.yml
        mode: "0644"

    - name: Start diun
      community.docker.docker_compose_v2:
        project_src: /home/pi/docker-files/diun
        state: present

    # --- backups ---
    - name: Deploy tar backup script
      ansible.builtin.template:
        src: templates/rpi-tar-backup.sh.j2
        dest: /home/ansible/rpi-tar-backup.sh
        mode: "0750"

    - name: Deploy SD image backup script
      ansible.builtin.template:
        src: templates/rpi-sd-image-backup.sh.j2
        dest: /home/ansible/rpi-sd-image-backup.sh
        mode: "0750"

    - name: Schedule daily tar backup
      ansible.builtin.cron:
        name: "rpi daily tar backup"
        minute: "30"
        hour: "3"
        user: ansible
        job: "sudo /home/ansible/rpi-tar-backup.sh"

    - name: Schedule weekly SD card image backup
      ansible.builtin.cron:
        name: "rpi weekly sd card image backup"
        minute: "0"
        hour: "4"
        weekday: "0"
        user: ansible
        job: "sudo /home/ansible/rpi-sd-image-backup.sh"

  handlers:
    - name: Reload nas automount
      ansible.builtin.systemd:
        name: mnt-nas.automount
        state: restarted
        daemon_reload: true
