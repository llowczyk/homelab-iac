---
- name: Deploy nas (nfs export + samba)
  hosts: nas
  become: true

  tasks:
    - name: Install nfs server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true

    - name: Configure NFS export
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: >-
          /mnt/nas
          192.168.10.0/24(rw,sync,no_subtree_check,no_root_squash)
          192.168.20.0/24(rw,sync,no_subtree_check,no_root_squash)
          192.168.30.0/24(rw,sync,no_subtree_check,no_root_squash)
        create: true
        mode: "0644"

    - name: Apply nfs exports
      ansible.builtin.command: exportfs -ra
      changed_when: false

    - name: Ensure nfs server is enabled and running
      ansible.builtin.systemd:
        name: nfs-kernel-server
        enabled: true
        state: started

    - name: Create samba directory
      ansible.builtin.file:
        path: /opt/samba
        state: directory
        mode: "0755"

    - name: Deploy samba compose file
      ansible.builtin.template:
        src: templates/nas-samba-compose.yml.j2
        dest: /opt/samba/docker-compose.yml
        mode: "0644"

    - name: Start samba
      community.docker.docker_compose_v2:
        project_src: /opt/samba
        state: present
