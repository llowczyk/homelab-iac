---
- name: Deploy jumpbox (tailscale subnet router)
  hosts: jumpbox
  become: true

  tasks:
    - name: Enable ip forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Add tailscale apt repo key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      changed_when: false

    - name: Add tailscale apt repo
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"
      changed_when: false

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        update_cache: true

    - name: Enable tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check current tailscale status
      ansible.builtin.command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Bring up tailscale, advertise subnet
      ansible.builtin.command: >
        tailscale up
        --authkey={{ tailscale_authkey }}
        --advertise-routes=192.168.10.0/24,192.168.20.0/24,192.168.30.0/24
        --accept-dns=false
      when: >
        ts_status.rc != 0 or
        '"BackendState": "Running"' not in ts_status.stdout
      register: ts_result
      changed_when: true

    - name: Restart tailscaled to ensure forwarding rules take priority over docker
      ansible.builtin.systemd:
        name: tailscaled
        state: restarted
      when: ts_result is changed # noqa: no-handler
