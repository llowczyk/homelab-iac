---
- name: deploy jumpbox (tailscale subnet router)
  hosts: jumpbox
  become: true

  tasks:
    - name: enable ip forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: add tailscale apt repo key
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg

    - name: add tailscale apt repo
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list

    - name: install tailscale
      apt:
        name: tailscale
        update_cache: true

    - name: enable tailscaled
      systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: bring up tailscale, advertise subnet
      command: >
        tailscale up
        --authkey={{ tailscale_authkey }}
        --advertise-routes=192.168.1.0/24
        --accept-dns=false
      register: ts_result
      changed_when: "'Success' in ts_result.stdout or ts_result.rc == 0"

    - name: restart tailscaled to ensure forwarding rules take priority over docker
      systemd:
        name: tailscaled
        state: restarted
