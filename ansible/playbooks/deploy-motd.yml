---
- name: Deploy MOTD banner
  hosts: prod:rpi
  become: true

  tasks:
    - name: Install figlet
      ansible.builtin.apt:
        name: figlet
        state: present
        update_cache: true

    - name: Download ANSI Shadow figlet font
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/xero/figlet-fonts/master/ANSI%20Shadow.flf
        dest: /usr/share/figlet/ANSI-Shadow.flf
        mode: "0644"

    - name: Remove default Ubuntu MOTD scripts that clutter the banner
      ansible.builtin.file:
        path: "/etc/update-motd.d/{{ item }}"
        state: absent
      loop:
        - 00-header
        - 50-landscape-sysinfo
        - 85-fwupd
        - 90-updates-available
        - 91-contract-ua-esm-status
        - 92-unattended-upgrades
        - 95-hwe-eol
        - 97-overlayroot
        - 98-fsck-at-reboot
        - 98-reboot-required

    - name: Deploy custom MOTD banner script
      ansible.builtin.template:
        src: templates/motd-banner.j2
        dest: /etc/update-motd.d/00-homelab-banner
        mode: "0755"

    - name: Ensure /etc/motd is empty
      ansible.builtin.copy:
        content: ""
        dest: /etc/motd
        mode: "0644"
        force: false
