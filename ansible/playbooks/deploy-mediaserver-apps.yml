---
- name: Deploy mediaserver app stack (arr suite, jellyfin, jellyseerr)
  hosts: mediaserver
  become: true

  tasks:
    - name: Create mediaserver stack directory
      ansible.builtin.file:
        path: /opt/mediaserver
        state: directory
        mode: "0755"

    - name: Deploy mediaserver compose file
      ansible.builtin.template:
        src: templates/mediaserver-compose.yml.j2
        dest: /opt/mediaserver/docker-compose.yml
        mode: "0644"

    - name: Start mediaserver stack
      community.docker.docker_compose_v2:
        project_src: /opt/mediaserver
        state: present
