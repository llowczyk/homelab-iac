name: ansible lint

on:
  workflow_dispatch:
  push:
    paths:
      - "ansible/**"
      - ".gitea/workflows/ansible-lint.yml"
  pull_request:
    paths:
      - "ansible/**"

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install python and pinned ansible + linters
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-venv python3-pip
          python3 --version
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --quiet --upgrade pip
          /opt/venv/bin/pip install --quiet -r ansible/requirements.txt
          /opt/venv/bin/pip install --quiet ansible-lint yamllint

      - name: yamllint
        run: |
          /opt/venv/bin/yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" ansible/

      - name: dummy vault password (syntax-check only needs the file to exist)
        run: echo "dummy" > /root/.vault_pass

      - name: ansible-lint
        working-directory: ansible
        run: /opt/venv/bin/ansible-lint playbooks/
