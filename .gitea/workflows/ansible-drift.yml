name: ansible drift check
on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install ansible
        working-directory: .
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pip openssh-client
          pip install --break-system-packages -r ansible/requirements.txt
          ansible --version

      - name: set up ssh key, vault password and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > ~/.ssh/ansible_key
          chmod 600 ~/.ssh/ansible_key

          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.vault_pass
          chmod 600 ~/.vault_pass

          mkdir -p playbooks/templates/zabbix-ssh-keys
          echo "${{ secrets.ZABBIX_TEMP_CHECK_KEY }}" > playbooks/templates/zabbix-ssh-keys/id_zabbix
          chmod 600 playbooks/templates/zabbix-ssh-keys/id_zabbix

          ansible-inventory --list \
            | python3 -c 'import json,sys; hv=json.load(sys.stdin)["_meta"]["hostvars"]; print("\n".join(sorted({v["ansible_host"] for v in hv.values() if "ansible_host" in v})))' \
            | xargs ssh-keyscan -H >> ~/.ssh/known_hosts 2>/dev/null

      - name: check drift
        run: |
          set -uo pipefail
          drift=0

          check() {
            local name="$1"; shift
            local log="/tmp/drift-${name}.log"
            echo "::group::${name}"
            if ! ansible-playbook "$@" --check 2>&1 | tee "$log"; then
              echo "::error::${name}: playbook run failed"
              drift=1
            fi
            # inspect every host in PLAY RECAP, not just the last line
            if grep -E 'changed=[1-9]|unreachable=[1-9]|failed=[1-9]' "$log"; then
              echo "::error::${name}: drift detected"
              drift=1
            fi
            echo "::endgroup::"
          }

          check golden-image       playbooks/initial-setup-prod.yml -l 'prod:!monitor:!tools'
          check golden-image-tools playbooks/initial-setup-prod.yml -l tools --skip-tags portainer_agent
          check nas                playbooks/deploy-nas.yml
          check monitoring         playbooks/deploy-monitoring.yml
          check torrentbox         playbooks/deploy-torrentbox-apps.yml
          check mediaserver        playbooks/deploy-mediaserver-apps.yml
          check proxy              playbooks/deploy-proxy-apps.yml
          check tools              playbooks/deploy-tools-apps.yml
          check rpi                playbooks/deploy-rpi-services.yml
          check jumpbox            playbooks/deploy-jumpbox.yml

          if [ "$drift" -ne 0 ]; then
            echo "::error::Ansible drift detected - see the groups above"
            exit 1
          fi
          echo "No drift detected."
