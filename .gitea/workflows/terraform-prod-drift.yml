name: terraform prod drift check
on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
jobs:
  drift-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: verify required secrets
        env:
          PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
          PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
          PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          VM_USER_PASSWORD: ${{ secrets.VM_USER_PASSWORD }}
        run: |
          missing=0
          for var in PROXMOX_ENDPOINT PROXMOX_API_TOKEN PROXMOX_SSH_KEY MINIO_ACCESS_KEY MINIO_SECRET_KEY VM_USER_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is empty or not set"
              missing=1
            fi
          done
          exit $missing

      - name: install terraform
        run: |
          apt-get update -qq
          apt-get install -y -qq wget unzip openssh-client
          wget -q https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip
          unzip -o terraform_1.10.5_linux_amd64.zip
          mv terraform /usr/local/bin/
          terraform -version

      - name: set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keyscan -H 192.168.1.100 >> ~/.ssh/known_hosts

      - name: terraform init
        env:
          TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_vm_user_password: ${{ secrets.VM_USER_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: terraform init

      - name: terraform plan (drift check)
        id: plan
        env:
          TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_vm_user_password: ${{ secrets.VM_USER_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::error::Drift detected — real infrastructure differs from Terraform config"
            exit 1
          elif [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          echo "No drift detected."
