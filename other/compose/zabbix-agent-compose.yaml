services:
  zabbix-agent:
    image: zabbix/zabbix-agent2@sha256:aa8fa07dbd41e148b6156555bf10ba6d928efa40f9a4632d6787fb90d4756679  # alpine-7.0.32
    container_name: zabbix-agent
    privileged: true
    group_add:
      - "988"
    environment:
      ZBX_SERVER_HOST: zabbix_server_host
      ZBX_HOSTNAME: zabbix_hostname
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "10050:10050"
    restart: unless-stopped
networks:
  infra:
    external: true
