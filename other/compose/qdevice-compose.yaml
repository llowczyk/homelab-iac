services:
  proxmox-qdevice:
    image: carolouellet/proxmox-qdevice@sha256:17033bc9a9c8b80d6b97bc04e944be27e6a7e144be724eb2d33102774788cfc1  # master
    platform: linux/arm64
    container_name: proxmox-qdevice
    hostname: ${HOSTNAME}
    restart: unless-stopped
    environment:
      - NEW_ROOT_PASSWORD=${ROOT_PASSWORD}
    volumes:
      - ${COROSYNC_DATA}:/etc/corosync
      - ${SSH_DATA}/etc/ssh:/etc/ssh
    networks:
      qdevice_net:
        ipv4_address: ${CONTAINER_IP}
    command: >
      sh -c "mkdir -p /run/sshd && supervisord"
networks:
  qdevice_net:
    driver: macvlan
    driver_opts:
      parent: ${PARENT_INTERFACE}
    ipam:
      config:
        - subnet: ${SUBNET}
          ip_range: ${IP_RANGE}
          gateway: ${GATEWAY}

